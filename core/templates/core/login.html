<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirish — Sertifikat Platformasi</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#0f3460 0%,#1e5fa8 55%,#2980b9 100%);display:flex;align-items:center;justify-content:center;padding:1rem}
.box{background:#fff;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,0.25)}
.logo{text-align:center;margin-bottom:2rem}
.logo-icon{width:62px;height:62px;background:#1e5fa8;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin-bottom:0.75rem}
.logo h2{font-size:20px;font-weight:700;color:#1e5fa8}
.logo p{font-size:13px;color:#6b7a8d;margin-top:3px}
.fgroup{margin-bottom:1rem}
.fgroup label{display:block;font-size:12px;font-weight:700;color:#6b7a8d;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
.fgroup input{width:100%;padding:11px 14px;border:1.5px solid #dde3ea;border-radius:8px;font-size:15px;font-family:inherit;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.fgroup input:focus{border-color:#1e5fa8;box-shadow:0 0 0 3px rgba(30,95,168,0.12)}
.btn{width:100%;padding:12px;background:#1e5fa8;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:background 0.2s}
.btn:hover{background:#174d8f}
.err{background:#fdf2f2;color:#e74c3c;border:1px solid #f5b8b8;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem}
.hint{text-align:center;font-size:12px;color:#6b7a8d;margin-top:1.25rem}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">📋</div>
    <h2>Sertifikat Platformasi</h2>
    <p>Is'hoqxon Ibrat nomidagi NDCTI</p>
  </div>
  {% if messages %}
    {% for m in messages %}<div class="err">{{ m }}</div>{% endfor %}
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="fgroup">
      <label>Foydalanuvchi nomi</label>
      <input type="text" name="username" placeholder="Login kiriting" autofocus autocomplete="username">
    </div>
    <div class="fgroup">
      <label>Parol</label>
      <input type="password" name="password" placeholder="Parol kiriting" autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Tizimga kirish →</button>
  </form>
  <div class="hint">2-A/O-sonli buyruq · 8-band · 10.2-kichik band ijrosi</div>
</div>
</body>
</html>
